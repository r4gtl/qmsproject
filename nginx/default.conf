server {
    listen 80;

    server_name localhost;

    # Max upload size (10MB)
    client_max_body_size 10M;

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Protected media - served only via X-Accel-Redirect from Django
    location ^~ /protected-media/ {
        internal;  # Only accessible via X-Accel-Redirect
        alias /mediafiles/;
        # No caching for protected files
    }

    # Public media: tools_images ONLY (deny-by-default)
    location ^~ /media/tools_images/ {
        alias /mediafiles/tools_images/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Public media: procedure documents (manuale procedure)
    location ^~ /media/procedure/ {
        alias /mediafiles/procedure/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Block direct access to tarature documents (403 Forbidden)
    location ^~ /media/tarature/ {
        return 403;  # Must use /api/manutenzioni/tarature/{id}/download/
    }

    # Block any other /media/* requests (404 Not Found)
    # Deny-by-default: only explicitly allowed paths above are accessible
    location ^~ /media/ {
        return 404;
    }

    location / {
        proxy_pass http://qms-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
